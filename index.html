<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sophia — Emotional Support Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2EFE8;
    --ink-2:rgba(242,239,232,.66);
    --ink-3:rgba(242,239,232,.42);
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.07);
    --glass:rgba(16,16,16,.52);
    --glass-strong:rgba(12,12,12,.82);
    --bot:rgba(255,255,255,.075);
    --user:#F2EFE8;
    --user-ink:#1B1B18;
    --accent:#7FBF8E;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#050505;
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- video background ---------- */
  #bg-video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:-2;
    pointer-events:none;
  }
  .bg-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 65%),
      linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,.7) 100%);
    z-index:-1;
    pointer-events:none;
  }

  /* ---------- call shell ---------- */
  .call-app{
    width:min(880px, 100%);
    height:min(90dvh, 900px);
    display:flex;
    flex-direction:column;
    gap:18px;
    position:relative;
  }

  /* ---------- header / avatar stage ---------- */
  .call-header{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:12px 20px 2px;
    text-align:center;
  }

  .avatar-ring{
    width:158px;
    height:158px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,.04));
    box-shadow:
      0 22px 60px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.12),
      0 0 50px rgba(255,255,255,.05);
    transition:box-shadow .4s ease, transform .4s ease;
    position:relative;
    overflow:hidden;
  }
  .avatar-ring img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    border-radius:50%;
    display:block;
    background:#222;
  }

  .avatar-ring.is-thinking{ animation:thinkPulse 1.6s ease-in-out infinite; }
  .avatar-ring.is-speaking{ animation:speakPulse 1.1s ease-in-out infinite; }

  @keyframes thinkPulse{
    0%,100%{ box-shadow:0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12), 0 0 0 0 rgba(255,255,255,.18); }
    50%    { box-shadow:0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.18), 0 0 0 14px rgba(255,255,255,.05); }
  }
  @keyframes speakPulse{
    0%,100%{ transform:scale(1);      box-shadow:0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.2), 0 0 0 6px rgba(255,255,255,.07); }
    50%    { transform:scale(1.025);  box-shadow:0 26px 70px rgba(0,0,0,.6),  0 0 0 1px rgba(255,255,255,.28), 0 0 0 18px rgba(255,255,255,.03); }
  }

  .call-name{
    margin:2px 0 0;
    font-size:22px;
    font-weight:500;
    letter-spacing:-.01em;
    color:var(--ink);
    text-shadow:0 2px 20px rgba(0,0,0,.5);
  }

  .call-status{
    margin:0;
    font-size:12.5px;
    color:var(--ink-2);
    display:flex;
    align-items:center;
    gap:7px;
    text-shadow:0 1px 12px rgba(0,0,0,.5);
  }
  .call-status .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(127,191,142,.18);
    flex:0 0 auto;
  }
  .call-status .sep{ opacity:.35; margin:0 2px; }
  .call-duration{ font-variant-numeric:tabular-nums; letter-spacing:.03em; opacity:.85; }

  .call-actions{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:6px;
  }

  /* ---------- toggle ---------- */
  .toggle{
    display:inline-flex;
    align-items:center;
    gap:9px;
    cursor:pointer;
    user-select:none;
    font-size:12.5px;
    color:var(--ink-2);
    position:relative;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(10px);
    transition:all .2s ease;
  }
  .toggle:hover{ border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.07); }
  .toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .toggle-track{
    width:34px; height:20px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    position:relative;
    transition:background .25s ease;
    flex:0 0 auto;
  }
  .toggle-thumb{
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .25s cubic-bezier(.3,.9,.4,1.2);
  }
  .toggle input:checked + .toggle-track{ background:var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb{ transform:translateX(14px); }
  .toggle input:focus-visible + .toggle-track{ box-shadow:0 0 0 3px rgba(255,255,255,.18); }

  .ghost-btn{
    font:inherit;
    font-size:12.5px;
    color:var(--ink-2);
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    transition:all .2s ease;
  }
  .ghost-btn:hover{ color:var(--ink); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.08); }

  /* ---------- chat panel ---------- */
  .chat-panel{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--glass);
    backdrop-filter:blur(26px) saturate(130%);
    -webkit-backdrop-filter:blur(26px) saturate(130%);
    border:1px solid var(--line);
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 34px 90px -34px rgba(0,0,0,.8);
  }

  .chat{
    flex:1 1 auto;
    overflow-y:auto;
    padding:24px 22px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
    overscroll-behavior:contain;
  }

  .msg{
    max-width:76%;
    padding:12px 16px;
    font-size:14.5px;
    line-height:1.6;
    border-radius:18px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    animation:rise .32s cubic-bezier(.2,.8,.3,1) both;
  }
  .msg--bot{
    align-self:flex-start;
    background:var(--bot);
    border:1px solid rgba(255,255,255,.08);
    color:var(--ink);
    border-bottom-left-radius:6px;
  }
  .msg--user{
    align-self:flex-end;
    background:var(--user);
    color:var(--user-ink);
    border-bottom-right-radius:6px;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* typing dots */
  .msg--typing{
    display:flex;
    align-items:center;
    gap:5px;
    padding:16px 18px;
  }
  .msg--typing span{
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    animation:dot 1.2s ease-in-out infinite;
  }
  .msg--typing span:nth-child(2){ animation-delay:.15s; }
  .msg--typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes dot{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  /* ---------- composer ---------- */
  .composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 16px 16px;
    border-top:1px solid var(--line-soft);
    background:rgba(0,0,0,.16);
  }
  .composer textarea{
    flex:1 1 auto;
    resize:none;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    border-radius:20px;
    padding:13px 17px;
    font:inherit;
    font-size:14.5px;
    line-height:1.45;
    color:var(--ink);
    max-height:130px;
    min-height:48px;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .composer textarea::placeholder{ color:var(--ink-3); }
  .composer textarea:focus{
    border-color:rgba(255,255,255,.28);
    background:rgba(255,255,255,.1);
  }

  .send{
    width:48px; height:48px;
    flex:0 0 auto;
    border:none;
    border-radius:50%;
    background:var(--user);
    color:var(--user-ink);
    display:grid; place-items:center;
    cursor:pointer;
    transition:transform .2s ease, opacity .2s ease;
  }
  .send:hover{ transform:translateY(-1px); opacity:.95; }
  .send:active{ transform:translateY(0); }

  /* ---------- scrollbar ---------- */
  .chat::-webkit-scrollbar,
  .panel-body::-webkit-scrollbar{ width:6px; }
  .chat::-webkit-scrollbar-thumb,
  .panel-body::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:999px; }
  .chat::-webkit-scrollbar-track,
  .panel-body::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- overlays / admin ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(6,6,6,.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:60;
  }
  .overlay.open{ display:flex; }

  .panel{
    background:var(--glass-strong);
    backdrop-filter:blur(30px) saturate(130%);
    -webkit-backdrop-filter:blur(30px) saturate(130%);
    border:1px solid var(--line);
    border-radius:22px;
    width:min(920px,100%);
    max-height:86dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    color:var(--ink);
    box-shadow:0 40px 100px -40px rgba(0,0,0,.85);
    animation:pop .28s cubic-bezier(.2,.8,.3,1) both;
  }
  .panel--sm{ width:min(400px,100%); padding:26px; }

  @keyframes pop{
    from{ opacity:0; transform:translateY(12px) scale(.99); }
    to{ opacity:1; transform:none; }
  }

  .panel h3{ margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .panel-sub{ margin:8px 0 18px; font-size:13px; color:var(--ink-2); line-height:1.6; }

  .field{
    width:100%;
    padding:12px 15px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    font:inherit;
    font-size:14px;
    color:var(--ink);
    background:rgba(255,255,255,.06);
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .field::placeholder{ color:var(--ink-3); }
  .field:focus{ border-color:rgba(255,255,255,.32); background:rgba(255,255,255,.1); }

  .panel-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }

  .btn{
    font:inherit;
    font-size:13px;
    font-weight:500;
    border-radius:999px;
    padding:9px 17px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:var(--ink);
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.22); }
  .btn--solid{ background:var(--user); border-color:var(--user); color:var(--user-ink); }
  .btn--solid:hover{ background:#fff; border-color:#fff; }
  .btn--danger{ color:#F0A8A0; border-color:rgba(240,168,160,.28); background:rgba(240,168,160,.06); }
  .btn--danger:hover{ background:rgba(240,168,160,.12); border-color:rgba(240,168,160,.4); }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:18px 22px;
    border-bottom:1px solid var(--line-soft);
    flex-wrap:wrap;
  }
  .panel-head > div{ display:flex; gap:10px; }

  .panel-body{
    padding:6px 22px 24px;
    overflow-y:auto;
  }
  .panel-body h4{
    margin:20px 0 10px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-3);
  }

  .session{
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    background:rgba(255,255,255,.03);
  }
  .session-head{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-2);
    letter-spacing:.03em;
    margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  .session-line{
    font-size:13px;
    line-height:1.6;
    color:rgba(242,239,232,.82);
    margin-bottom:6px;
    overflow-wrap:anywhere;
  }
  .session-line b{ color:var(--ink); font-weight:600; }

  .q-item{
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    background:rgba(255,255,255,.03);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .q-item p{ margin:0; font-size:13.5px; line-height:1.55; overflow-wrap:anywhere; }
  .q-form{ display:flex; gap:8px; }
  .q-form .field{ padding:9px 13px; font-size:13px; border-radius:11px; }

  .empty{
    font-size:13px;
    color:var(--ink-3);
    margin:6px 0 0;
  }

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    body{ padding:0; overflow:auto; }
    .call-app{
      width:100%;
      height:100dvh;
      gap:12px;
      padding:0;
    }
    .call-header{
      padding:16px 16px 4px;
    }
    .avatar-ring{ width:124px; height:124px; }
    .call-name{ font-size:19px; }
    .chat-panel{
      border-radius:24px 24px 0 0;
      border-left:none;
      border-right:none;
      border-bottom:none;
    }
    .chat{ padding:20px 15px 8px; }
    .msg{ max-width:86%; font-size:14px; padding:11px 14px; }
    .composer{ padding:10px 12px 14px; }
    .composer textarea{ font-size:16px; /* prevents iOS zoom */ }
    .panel--sm{ padding:22px; }
    .panel-body{ padding:4px 16px 20px; }
  }

  @media (max-width:400px){
    .avatar-ring{ width:104px; height:104px; }
    .call-actions{ gap:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<!-- Background video (from previous version) -->
<video autoplay muted loop playsinline id="bg-video" poster="">
  <source src="video.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>

<!-- Call interface -->
<main class="call-app">

  <header class="call-header">
    <div class="avatar-ring" id="avatar-ring">
      <img id="avatar" src="sophia.png" alt="Sophia"
           onerror="this.style.display='none'">
    </div>
    <h1 class="call-name">Sophia</h1>
    <p class="call-status">
      <span class="dot"></span>
      <span id="status-text">Here with you</span>
      <span class="sep">·</span>
      <span class="call-duration" id="call-duration">00:00</span>
    </p>
    <div class="call-actions">
      <label class="toggle" title="Read replies aloud in a female voice">
        <input type="checkbox" id="tts-switch" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>Voice</span>
      </label>
      <button class="ghost-btn" onclick="showAdminLogin()">Admin</button>
    </div>
  </header>

  <section class="chat-panel">
    <div class="chat" id="chat" aria-live="polite" aria-label="Conversation"></div>
    <footer class="composer">
      <textarea id="user-input" rows="1" placeholder="Share what's on your mind…"
                aria-label="Message Sophia"></textarea>
      <button class="send" id="send-btn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13"/>
          <path d="M12.5 5.5 19 12l-6.5 6.5"/>
        </svg>
      </button>
    </footer>
  </section>

</main>

<!-- Admin login -->
<div class="overlay" id="login-overlay">
  <div class="panel panel--sm" role="dialog" aria-modal="true" aria-label="Admin login">
    <h3>Admin access</h3>
    <p class="panel-sub">Sign in to review conversations and answer pending questions.</p>
    <input class="field" type="password" id="admin-password" placeholder="Password" autocomplete="current-password">
    <div class="panel-actions">
      <button class="btn" onclick="hideAdminLogin()">Cancel</button>
      <button class="btn btn--solid" onclick="checkAdminLogin()">Sign in</button>
    </div>
  </div>
</div>

<!-- Admin panel -->
<div class="overlay" id="admin-panel">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Admin panel">
    <div class="panel-head">
      <h3>Admin panel</h3>
      <div>
        <button class="btn btn--danger" onclick="clearAllChats()">Clear chats</button>
        <button class="btn" onclick="logoutAdmin()">Log out</button>
      </div>
    </div>
    <div class="panel-body">
      <h4>Conversations</h4>
      <div id="admin-chats"></div>
      <h4>Pending questions</h4>
      <div id="pending-questions-list"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Storage
   ============================================================ */
const CHAT_STORAGE_KEY      = 'sophia_chat_storage';
const KNOWLEDGE_BASE_KEY    = 'sophia_knowledge_base';
const PENDING_QUESTIONS_KEY = 'sophia_pending_questions';
const ADMIN_PASSWORD        = 'sophia123'; // ← change this

/* ============================================================
   DOM
   ============================================================ */
const chatEl               = document.getElementById('chat');
const avatarImg            = document.getElementById('avatar');
const avatarRing           = document.getElementById('avatar-ring');
const statusEl             = document.getElementById('status-text');
const durationEl           = document.getElementById('call-duration');
const ttsSwitch            = document.getElementById('tts-switch');
const inputEl              = document.getElementById('user-input');
const sendBtn              = document.getElementById('send-btn');
const loginOverlay         = document.getElementById('login-overlay');
const adminPanel           = document.getElementById('admin-panel');
const adminChats           = document.getElementById('admin-chats');
const adminPasswordInput   = document.getElementById('admin-password');
const pendingQuestionsList = document.getElementById('pending-questions-list');

const sessionId = 'user_' + Math.random().toString(36).slice(2, 11);
let isAdmin = false;

/* ============================================================
   Call duration timer
   ============================================================ */
const callStart = Date.now();
setInterval(() => {
  const elapsed = Math.floor((Date.now() - callStart) / 1000);
  const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const secs = String(elapsed % 60).padStart(2, '0');
  durationEl.textContent = mins + ':' + secs;
}, 1000);

/* ============================================================
   Bootstrap storage
   ============================================================ */
function initializeStorage() {
  if (!localStorage.getItem(CHAT_STORAGE_KEY)) {
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify({}));
  }
  if (!localStorage.getItem(KNOWLEDGE_BASE_KEY)) {
    localStorage.setItem(KNOWLEDGE_BASE_KEY, JSON.stringify({
      "hello": "Hi there. How can I support you today?",
      "help": "I'm here for you. What do you need?",
      "sadness": "I'm sorry to hear that. Want to share more?",
      "depressed": "It's okay to feel this way. I'm here to listen.",
      "anxious": "Take a deep breath. I'm right here with you.",
      "stressed": "It's normal to feel stressed. Let's talk it through.",
      "stress": "Try taking a slow breath. I'm here with you.",
      "lonely": "You are not alone. I'm here for you.",
      "i need help": "Of course — what can I help you with?",
      "thank you": "You're welcome. I'm glad I could help.",
      "goodbye": "Take care. I'm here whenever you need me.",
      "bye": "Goodbye. I'm just a message away.",
      "love": "Love is a beautiful feeling. Hold onto it.",
      "hate": "It's okay to feel that way sometimes. Let's talk about it.",
      "confused": "It's okay to feel confused. Let's figure it out together.",
      "breakup": "Breakups are really tough. I'm here to support you.",
      "relationship": "Relationships can be challenging. I'm here to help.",
      "angry": "It's okay to feel angry. I'm listening.",
      "tired": "You deserve rest. Take it easy tonight.",
      "sad": "I'm here for you. Want to talk more about it?",
      "happy": "That's wonderful. Tell me more."
    }));
  }
  if (!localStorage.getItem(PENDING_QUESTIONS_KEY)) {
    localStorage.setItem(PENDING_QUESTIONS_KEY, JSON.stringify([]));
  }
}
initializeStorage();

/* ============================================================
   Avatar / status  (images from previous version)
   ============================================================ */
const AVATARS = {
  idle:     'sophia.png',
  thinking: 'sophiaThink.png',
  speaking: 'sophiat.png',
  typing:   'sophiat.png'
};

function setAvatar(state) {
  const src = AVATARS[state] || AVATARS.idle;

  if (avatarImg.getAttribute('src') !== src) {
    avatarImg.src = src;
    avatarImg.style.display = '';
  }

  avatarRing.classList.toggle('is-thinking', state === 'thinking' || state === 'typing');
  avatarRing.classList.toggle('is-speaking', state === 'speaking');

  statusEl.textContent =
    state === 'typing'   ? 'Typing…'   :
    state === 'speaking' ? 'Speaking…' :
    state === 'thinking' ? 'Thinking…' :
                           'Here with you';
}

/* ============================================================
   Persistence
   ============================================================ */
function saveMessage(sender, message) {
  const allChats = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '{}');
  if (!allChats[sessionId]) allChats[sessionId] = [];
  allChats[sessionId].push({ sender, message, timestamp: new Date().toISOString() });
  localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(allChats));
  if (isAdmin) loadAllChats();
}

function savePendingQuestion(question) {
  const pending = JSON.parse(localStorage.getItem(PENDING_QUESTIONS_KEY) || '[]');
  const q = question.toLowerCase().trim();
  if (!pending.includes(q)) {
    pending.push(q);
    localStorage.setItem(PENDING_QUESTIONS_KEY, JSON.stringify(pending));
    if (isAdmin) loadPendingQuestions();
  }
}

/* ============================================================
   Female voice selection
   ============================================================ */
let cachedVoice = null;

const FEMALE_NAMES = [
  'Google UK English Female',
  'Google US English',
  'Microsoft Aria Online (Natural)',
  'Microsoft Aria',
  'Microsoft Zira - English (United States)',
  'Microsoft Zira',
  'Samantha',
  'Karen',
  'Moira',
  'Tessa',
  'Fiona',
  'Victoria',
  'Serena',
  'Susan',
  'Veena'
];

const FEMALE_HINTS = /female|woman|zira|aria|jenny|samantha|karen|moira|tessa|fiona|victoria|serena|susan|veena|emma|ava|allison|joanna|salli|amy|nicole/i;

function getFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;

  for (const name of FEMALE_NAMES) {
    const exact = voices.find(v => v.name.toLowerCase() === name.toLowerCase());
    if (exact) return exact;
  }
  for (const name of FEMALE_NAMES) {
    const partial = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (partial) return partial;
  }
  const hinted = voices.find(v => FEMALE_HINTS.test(v.name));
  if (hinted) return hinted;

  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0];
}

function refreshVoice() {
  cachedVoice = getFemaleVoice();
}

if ('speechSynthesis' in window) {
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;
  window.addEventListener('load', refreshVoice);
}

/* ============================================================
   Emoji stripping (for TTS only)
   ============================================================ */
function stripEmojis(text) {
  if (!text) return '';
  try {
    // Unicode property escapes — modern browsers
    return text
      .replace(/[\p{Extended_Pictographic}\u{200D}\u{FE0F}\u{1F3FB}-\u{1F3FF}]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  } catch (e) {
    // Fallback for older engines
    return text
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{1F3FB}-\u{1F3FF}]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
}

/* ============================================================
   Speech output — emojis removed, female voice
   ============================================================ */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window) || !ttsSwitch.checked) {
    if (typeof onEnd === 'function') onEnd();
    return;
  }

  const clean = stripEmojis(text);
  if (!clean) {
    if (typeof onEnd === 'function') onEnd();
    return;
  }

  try {
    speechSynthesis.cancel();
    if (!cachedVoice) refreshVoice();

    const utter = new SpeechSynthesisUtterance(clean);
    if (cachedVoice) {
      utter.voice = cachedVoice;
      utter.lang  = cachedVoice.lang;
    }
    utter.pitch  = 1.15;   // brighter, more feminine
    utter.rate   = 1.0;
    utter.volume = 1;

    let finished = false;
    const done = () => {
      if (!finished) {
        finished = true;
        if (typeof onEnd === 'function') onEnd();
      }
    };
    utter.onend   = done;
    utter.onerror = done;

    speechSynthesis.speak(utter);
  } catch (err) {
    if (typeof onEnd === 'function') onEnd();
  }
}

/* ============================================================
   Message rendering
   ============================================================ */
function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function typeWriter(el, text, done) {
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, ++i);
    scrollToBottom();
    if (i < text.length) {
      setTimeout(step, 14 + Math.random() * 12);
    } else if (typeof done === 'function') {
      done();
    }
  })();
}

function playBotMessage(bubble, text) {
  let typingDone = false;
  let speechDone = false;

  const sync = () => {
    if (!typingDone)       setAvatar('typing');
    else if (!speechDone)  setAvatar('speaking');
    else                   setAvatar('idle');
  };

  setAvatar('typing');
  speak(text, () => { speechDone = true; sync(); });
  typeWriter(bubble, text, () => { typingDone = true; sync(); });
}

function appendMessage(sender, message, animate = false) {
  const bubble = document.createElement('div');
  bubble.className = 'msg msg--' + sender;
  chatEl.appendChild(bubble);
  saveMessage(sender, message);
  scrollToBottom();

  if (sender === 'bot') {
    if (animate) {
      playBotMessage(bubble, message);
    } else {
      bubble.textContent = message;
      setAvatar('speaking');
      speak(message, () => setAvatar('idle'));
    }
  } else {
    bubble.textContent = message;
  }
}

function showThinking() {
  const el = document.createElement('div');
  el.className = 'msg msg--bot msg--typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(el);
  scrollToBottom();
  return el;
}

/* ============================================================
   Response engine
   ============================================================ */
function getBotResponse(text) {
  const input = text.toLowerCase().trim();
  const kb = JSON.parse(localStorage.getItem(KNOWLEDGE_BASE_KEY) || '{}');

  if (kb[input]) return Promise.resolve(kb[input]);

  for (const key in kb) {
    if (key && input.includes(key)) return Promise.resolve(kb[key]);
  }

  for (const word of input.split(/\s+/)) {
    if (word && kb[word]) return Promise.resolve(kb[word]);
  }

  if (/\b(what|how|why|when|where|who)\b/.test(input)) {
    return fetchWebResult(input);
  }

  savePendingQuestion(text);
  const neutral = [
    "I'm still learning, so I've noted this question for review.",
    "That's a thoughtful question. Let me flag it so I can answer it properly.",
    "I don't have an answer for that yet — I've saved it for review."
  ];

  setAvatar('thinking');
  return new Promise(resolve => {
    setTimeout(() => resolve(neutral[Math.floor(Math.random() * neutral.length)]), 900);
  });
}

async function fetchWebResult(query) {
  try {
    setAvatar('thinking');
    const res = await fetch(
      'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json&no_redirect=1&no_html=1'
    );
    const data = await res.json();

    if (data.AbstractText) return data.AbstractText;
    if (data.RelatedTopics && data.RelatedTopics.length) {
      return data.RelatedTopics[0].Text || "I found something, but it's a bit vague. Could you rephrase?";
    }
    savePendingQuestion(query);
    return "I couldn't find a direct answer, but I've noted your question for review.";
  } catch (err) {
    savePendingQuestion(query);
    return "Sorry, I couldn't reach the search service. I've noted your question for review.";
  }
}

/* ============================================================
   Send flow
   ============================================================ */
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  appendMessage('user', text);
  inputEl.value = '';
  autoGrow();

  const thinking = showThinking();
  setAvatar('thinking');

  getBotResponse(text)
    .then(response => {
      thinking.remove();
      appendMessage('bot', response, true);
    })
    .catch(() => {
      thinking.remove();
      appendMessage('bot', "I'm here with you. Could you tell me a little more?", true);
    });
}

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
}

inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

/* ============================================================
   Admin — login
   ============================================================ */
function showAdminLogin() {
  loginOverlay.classList.add('open');
  adminPasswordInput.value = '';
  setTimeout(() => adminPasswordInput.focus(), 50);
}

function hideAdminLogin() {
  loginOverlay.classList.remove('open');
  adminPasswordInput.value = '';
}

function checkAdminLogin() {
  if (adminPasswordInput.value === ADMIN_PASSWORD) {
    isAdmin = true;
    loginOverlay.classList.remove('open');
    adminPanel.classList.add('open');
    adminPasswordInput.value = '';
    loadAllChats();
    loadPendingQuestions();
  } else {
    adminPasswordInput.value = '';
    adminPasswordInput.focus();
    adminPasswordInput.style.borderColor = 'rgba(240,168,160,.6)';
    setTimeout(() => { adminPasswordInput.style.borderColor = ''; }, 1200);
  }
}

function logoutAdmin() {
  isAdmin = false;
  adminPanel.classList.remove('open');
}

adminPasswordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAdminLogin();
});

/* ============================================================
   Admin — conversations
   ============================================================ */
function loadAllChats() {
  if (!isAdmin) return;

  const allChats = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '{}');
  const sessions = Object.entries(allChats);
  adminChats.innerHTML = '';

  if (!sessions.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'No conversations yet.';
    adminChats.appendChild(p);
    return;
  }

  sessions.forEach(([sid, messages]) => {
    const wrap = document.createElement('div');
    wrap.className = 'session';

    const head = document.createElement('div');
    head.className = 'session-head';
    head.textContent = 'Session · ' + sid;
    wrap.appendChild(head);

    messages.forEach(m => {
      const line = document.createElement('div');
      line.className = 'session-line';

      const label = document.createElement('b');
      label.textContent = (m.sender === 'bot' ? 'Sophia: ' : 'User: ');

      line.appendChild(label);
      line.appendChild(document.createTextNode(m.message));
      wrap.appendChild(line);
    });

    adminChats.appendChild(wrap);
  });
}

/* ============================================================
   Admin — pending questions
   ============================================================ */
function loadPendingQuestions() {
  if (!isAdmin) return;

  const pending = JSON.parse(localStorage.getItem(PENDING_QUESTIONS_KEY) || '[]');
  pendingQuestionsList.innerHTML = '';

  if (!pending.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Nothing pending. All questions answered.';
    pendingQuestionsList.appendChild(p);
    return;
  }

  pending.forEach((question, index) => {
    const item = document.createElement('div');
    item.className = 'q-item';

    const text = document.createElement('p');
    text.textContent = question;
    item.appendChild(text);

    const form = document.createElement('div');
    form.className = 'q-form';

    const field = document.createElement('input');
    field.className = 'field';
    field.type = 'text';
    field.placeholder = 'Write a response…';

    const btn = document.createElement('button');
    btn.className = 'btn btn--solid';
    btn.textContent = 'Add';

    const submit = () => addAnswer(question, index, field);
    btn.addEventListener('click', submit);
    field.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    form.appendChild(field);
    form.appendChild(btn);
    item.appendChild(form);

    pendingQuestionsList.appendChild(item);
  });
}

function addAnswer(question, index, fieldEl) {
  const answer = (fieldEl.value || '').trim();
  if (!answer) { fieldEl.focus(); return; }

  const kb = JSON.parse(localStorage.getItem(KNOWLEDGE_BASE_KEY) || '{}');
  kb[question.toLowerCase()] = answer;
  localStorage.setItem(KNOWLEDGE_BASE_KEY, JSON.stringify(kb));

  const pending = JSON.parse(localStorage.getItem(PENDING_QUESTIONS_KEY) || '[]');
  pending.splice(index, 1);
  localStorage.setItem(PENDING_QUESTIONS_KEY, JSON.stringify(pending));

  loadPendingQuestions();
}

function clearAllChats() {
  if (!confirm('Delete all conversation history?')) return;
  localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify({}));
  loadAllChats();
}

/* ============================================================
   Overlay backdrop close
   ============================================================ */
[loginOverlay, adminPanel].forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target !== overlay) return;
    if (overlay === loginOverlay) hideAdminLogin();
    else logoutAdmin();
  });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (loginOverlay.classList.contains('open')) hideAdminLogin();
  else if (adminPanel.classList.contains('open')) logoutAdmin();
});

/* ============================================================
   Initial greeting
   ============================================================ */
setAvatar('idle');
autoGrow();
setTimeout(() => {
  appendMessage(
    'bot',
    "Hi, I'm Sophia. This is a quiet space to talk about how you're feeling. What's on your mind today?",
    true
  );
}, 700);
</script>
